apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gvents-order-service-prod
  namespace: argocd
  labels:
    environment: production
    team: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/3lVv0w/code-to-cloud-workshop.git
    targetRevision: main
    path: workshop-setup/04-gitops-manifests/base
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true     # Purge live resources deleted from Git
      selfHeal: true  # Revert out-of-band manual changes
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
